<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14121b"><title>Round V3 — live prototype</title><style>:root{--bg:#14121b;--panel:#1e1b27;--raised:#292433;--line:#3d3748;--ink:#f8f5ff;--muted:#b9b1c7;--a:#cbb2ff;--lime:#dff0a7;--peach:#ffc1a9;--mint:#a8dfc2;--sky:#a9d6ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}h1,h2,h3,p{margin:0}.app{max-width:560px;margin:auto;padding:0 18px 110px;min-height:100vh}.demo{font-size:9px;letter-spacing:.08em;text-align:center;color:var(--muted);padding:7px;border-bottom:1px solid var(--line)}header{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:28px;letter-spacing:-1.5px;display:flex;gap:8px;align-items:center}.mark{width:22px;height:22px;border-radius:9px 9px 11px 11px;background:var(--a);transform:rotate(-9deg);position:relative}.mark:before,.mark:after{content:"";position:absolute;top:8px;width:3px;height:5px;border-radius:4px;background:#2b1d43}.mark:before{left:6px}.mark:after{right:6px}.avatar{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#a8dfc2,#cbb2ff);display:grid;place-items:center;color:#251a34;font-weight:900}.heading{margin:4px 0 14px}.heading h1{font-size:28px;letter-spacing:-1px}.heading p{color:var(--muted);font-size:12px;margin-top:5px}.search{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px}.search input{border:0;outline:0;background:none;width:100%;padding:13px 6px;font-size:16px}.filters{display:flex;gap:7px;margin:9px 0 8px}.filters select{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 7px;font-size:11px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:none;color:var(--muted);border-radius:20px;padding:7px 11px;font-size:11px}.chip.on{background:var(--a);color:#2a1d42;border-color:transparent}.party{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:14px;margin:10px 0}.party.hot{border-color:#826a98;background:linear-gradient(120deg,#30223f,var(--panel) 70%)}.top{display:flex;gap:10px;align-items:flex-start}.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--raised);font-size:20px}.grow{flex:1}.party h3{font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:3px}.need{font-size:9px;background:var(--lime);color:#243117;padding:4px 7px;border-radius:7px;font-weight:800}.quote{margin:10px 0 8px;font-size:11px;background:#ffffff08;padding:8px 10px;border-radius:5px 12px 12px 12px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 6px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.faces{display:flex}.face{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;margin-left:-5px;border:2px solid var(--panel);background:#6c587e}.face:nth-child(2){background:#51736d}.face:nth-child(3){background:#6c6f91}.face:first-child{margin-left:0}.open{width:24px;height:24px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;margin-left:4px;color:var(--muted)}.join{background:var(--a);color:#291d42;border-radius:11px;padding:10px 12px;font-size:11px;font-weight:800}.guide{background:var(--raised);border-radius:15px;padding:12px;margin:16px 0;font-size:12px}.guide p{color:var(--muted);font-size:11px;margin-top:3px}.guide button{margin-top:10px;background:none;color:var(--a);padding:0;font-weight:700}.nav{position:fixed;left:0;right:0;bottom:0;background:#14121bf2;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;color:var(--muted);min-height:48px;font-size:10px}.nav button.on{color:var(--a)}.fab{position:fixed;right:20px;bottom:82px;background:var(--a);color:#291d42;border-radius:16px;padding:12px 15px;font-weight:800;box-shadow:0 10px 30px #0007}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.state{background:#cab2ff15;border:1px solid #cab2ff55;border-radius:16px;padding:15px;margin:14px 0}.state p,.small{font-size:11px;color:var(--muted)}.members{margin-top:10px}.member{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.member:last-child{border:0}.member .face{margin:0;width:34px;height:34px}.member span{margin-left:auto;font-size:10px;color:var(--muted)}.chat{max-height:240px;overflow:auto}.msg{margin:9px 0;font-size:12px}.msg b{display:block;color:var(--peach);font-size:9px}.mine{text-align:right}.mine b{color:var(--a)}.composer{display:flex;gap:6px;margin-top:8px}.composer input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:16px}.composer button{background:var(--a);color:#291d42;border-radius:10px;padding:0 13px}.collectionHero{background:linear-gradient(150deg,#342344,var(--panel) 70%);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.ap{font-size:31px;font-weight:900}.ap small{font-size:11px;color:var(--muted)}.char{height:170px;display:grid;place-items:center;font-size:95px;filter:drop-shadow(0 8px 10px #0005)}.rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reward{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.reward .art{font-size:46px}.reward h3{font-size:13px;margin-top:6px}.reward p{font-size:10px;color:var(--muted);margin-top:3px}.reward.lock{opacity:.5}.crew{display:flex;align-items:center;gap:10px}.crew .face{margin:0;width:42px;height:42px}.crew button{margin-left:auto;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:10px}.modalBg{position:fixed;inset:0;background:#08050dc4;z-index:30;display:flex;align-items:flex-end}.modal{width:100%;max-width:560px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.close{float:right;background:none;color:var(--muted);font-size:23px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.control{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px}.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.seg button.on{background:var(--a);color:#291d42}.cta{width:100%;background:var(--a);color:#291d42;border-radius:12px;padding:12px;font-weight:900;margin-top:10px}.toast{position:fixed;z-index:50;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:11px;max-width:90%}@media(min-width:780px){.app{max-width:720px}.nav{left:50%;transform:translateX(-50%);max-width:620px;border:1px solid var(--line);border-radius:18px 18px 0 0}.fab{right:calc(50% - 330px)}}</style></head><body><div class="demo">INTERACTIVE V3 DEMO · FICTIONAL PEOPLE & PLACES</div><div class="app"><header><div class="brand"><span class="mark"></span>round</div><div class="avatar">JD</div></header><main id="main"></main></div><nav class="nav" id="nav"></nav><button class="fab" id="fab">＋ Start</button><div id="modal"></div><div id="toast" class="toast" hidden></div><script>const groups=[{id:'cards',cat:'Games',ico:'🂡',title:'Spades',mins:14,dist:.3,have:3,total:4,place:'Common Table Café',quote:'Deck is out. Fourth chair is yours.',tags:['Happy to explain','45–60 min']},{id:'pickle',cat:'Sports',ico:'🏓',title:'Pickleball doubles',mins:18,dist:.7,have:3,total:4,place:'Commons Courts',quote:'Casual doubles. Spare paddle here.',tags:['Free','45–60 min']},{id:'coffee',cat:'Talk',ico:'☕',title:'Coffee + good conversation',mins:9,dist:.2,have:2,total:4,place:'North Corner Coffee',quote:'No agenda. Just something interesting.',tags:['Pay your own','30–45 min']},{id:'walk',cat:'Outside',ico:'🚶',title:'A walk, no rush',mins:11,dist:.4,have:2,total:5,place:'Cedar Park',quote:'Easy pace. Paved loop.',tags:['Free','25–40 min']},{id:'ai',cat:'Talk',ico:'💬',title:'AI, over coffee',mins:19,dist:.4,have:2,total:4,place:'North Corner Coffee',quote:'Curious is enough. No expertise required.',tags:['Discussion','30–45 min']}];let s={page:'now',cat:'All',q:'',time:20,dist:1,active:null,ready:false,arrived:false,confirmed:false,ap:35,equipped:'none',chat:[]};const main=document.querySelector('#main'),nav=document.querySelector('#nav'),modal=document.querySelector('#modal'),fab=document.querySelector('#fab');function render(){nav.innerHTML=['now','party','collection','crew'].map(x=>`<button class="${s.page===x?'on':''}" onclick="s.page='${x}';render()">${{now:'⌁ Now',party:'◉ Party',collection:'✦ Collection',crew:'♡ Crew'}[x]}</button>`).join('');fab.hidden=s.page!=='now';if(s.page==='now')now();if(s.page==='party')party();if(s.page==='collection')collection();if(s.page==='crew')crew()}function now(){let cats=['All','Sports','Games','Talk','Outside'];let list=groups.filter(g=>(s.cat==='All'||g.cat===s.cat)&&g.mins<=s.time&&g.dist<=s.dist&&(g.title+' '+g.quote).toLowerCase().includes(s.q.toLowerCase()));main.innerHTML=`<div class="heading"><h1>Open spots nearby.</h1><p>Something you like. A few good people. Go.</p></div><label class="search">⌕<input placeholder="Cards, pickleball, coffee…" value="${s.q}" oninput="s.q=this.value;now()"></label><div class="filters"><select onchange="s.time=+this.value;now()"><option value="10" ${s.time===10?'selected':''}>Next 10 min</option><option value="20" ${s.time===20?'selected':''}>Next 20 min</option></select><select onchange="s.dist=+this.value;now()"><option value=".5" ${s.dist===.5?'selected':''}>Within .5 mi</option><option value="1" ${s.dist===1?'selected':''}>Within 1 mi</option><option value="3" ${s.dist===3?'selected':''}>Within 3 mi</option></select></div><div class="chips">${cats.map(c=>`<button class="chip ${s.cat===c?'on':''}" onclick="s.cat='${c}';now()">${c}</button>`).join('')}</div><div class="small" style="margin:7px 0">${list.length} rounds with room</div>${list.map(card).join('')}<div class="guide"><b>Not sure what you’re up for?</b><p>Tell Round your mood and it can narrow the sample groups without joining anything for you.</p><button onclick="guide()">Help me choose →</button></div>`}function card(g){return `<article class="party ${g.total-g.have===1?'hot':''}"><div class="top"><div class="ico">${g.ico}</div><div class="grow"><h3>${g.title}</h3><div class="meta">In ${g.mins} min · ${g.dist} mi · ${g.place}</div></div>${g.total-g.have===1?'<span class="need">NEED 1</span>':''}</div><div class="quote">“${g.quote}”</div><div class="tags">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="bottom"><div><div class="faces"><span class="face">MY</span><span class="face">LO</span>${g.have>2?'<span class="face">SM</span>':''}<span class="open">+</span></div><div class="capacity">${g.have}/${g.total} joined · ${g.total-g.have} open</div></div><button class="join" onclick="detail('${g.id}')">${g.total-g.have===1?'Be the fourth':'View spot'}</button></div></article>`}function detail(id){let g=groups.find(x=>x.id===id);modal.innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeM()"><div class="modal"><button class="close" onclick="closeM()">×</button><h2>${g.ico} ${g.title}</h2><p class="small" style="margin:6px 0 14px">${g.quote}</p><div class="panel"><b>${g.place}</b><p class="small">${g.dist} mi · starts in ${g.mins} min · public sample venue</p></div><div class="panel"><b>Who's in</b><div class="members"><div class="member"><span class="face">MY</span>Maya<span>18 rounds</span></div><div class="member"><span class="face">LO</span>Leo<span>12 rounds</span></div>${g.have>2?'<div class="member"><span class="face">SM</span>Sam<span>9 rounds</span></div>':''}</div></div><p class="small">Joining claims a spot. It does not prove attendance or completion.</p><button class="cta" onclick="join('${g.id}')">Join this round</button></div></div>`}function join(id){s.active=id;s.page='party';closeM();render();toast('Spot claimed in this demo.')}function party(){if(!s.active){main.innerHTML='<div class="heading"><h1>Your next round.</h1><p>Join something nearby and it appears here.</p></div><div class="panel">No active round yet.</div>';return}let g=groups.find(x=>x.id===s.active);main.innerHTML=`<div class="heading"><h1>${g.ico} ${g.title}</h1><p>${g.place} · starts in ${g.mins} min</p></div><div class="state"><h3>${s.confirmed?'That was a good round.':s.arrived?'You checked in.':s.ready?'You’re ready.':'One little ready check.'}</h3><p>${s.confirmed?'Your group-confirmed completion unlocked a reward.':s.arrived?'Check-in is only your claim. Finish the activity before confirming.':s.ready?'The group sees you as ready.':"Say you're actually going before the group locks."}</p>${!s.ready?'<button class="join" onclick="s.ready=true;party()">I’m going</button>':!s.arrived?'<button class="join" onclick="s.arrived=true;party()">Demo: I’m here</button>':!s.confirmed?'<button class="join" onclick="completeRound()">Demo peer confirmation</button>':'<button class="join" onclick="s.page=\'collection\';render()">See reward</button>'}</div><div class="panel"><b>Party</b><div class="members"><div class="member"><span class="face">MY</span>Maya<span>Ready</span></div><div class="member"><span class="face">LO</span>Leo<span>Ready</span></div><div class="member"><span class="face">SM</span>Sam<span>Ready</span></div><div class="member"><span class="face" style="background:var(--a);color:#291d42">JD</span>You<span>${s.ready?'Ready':'Joined'}</span></div></div></div><div class="panel"><b>Round chat</b><div class="chat"><div class="msg"><b>Maya · sample</b>I’ve got the cards. Back table.</div><div class="msg"><b>Leo · sample</b>Walking over now.</div>${s.chat.map(x=>`<div class="msg mine"><b>You · local demo</b>${escapeHtml(x)}</div>`).join('')}</div><form class="composer" onsubmit="event.preventDefault();let i=this.querySelector('input');if(i.value.trim()){s.chat.push(i.value.trim());i.value='';party()}"><input maxlength="180" placeholder="Say a quick hello…"><button>➜</button></form></div><button class="join" style="background:var(--raised);color:var(--ink)" onclick="s.active=null;s.ready=s.arrived=s.confirmed=false;s.page='now';render()">Release my spot</button>`}function completeRound(){if(!s.confirmed){s.confirmed=true;s.ap+=40;s.equipped='cards';toast('Wild Card unlocked · +40 AP')}party()}function collection(){main.innerHTML=`<div class="heading"><h1>Your little world.</h1><p>Things you did become things you can keep.</p></div><div class="collectionHero"><div class="ap">${s.ap} <small>AP · experiences, not a people score</small></div><div class="char">${s.equipped==='cards'?'🤖🃏':'🤖'}</div><div class="small" style="text-align:center">Jamie · ${s.equipped==='cards'?'Wild Card equipped':'starter look'}</div></div><div class="rewards"><div class="reward ${s.confirmed?'':'lock'}"><div class="art">🃏</div><h3>Wild Card</h3><p>${s.confirmed?'Earned · card fan prop':'Complete a confirmed card round'}</p>${s.confirmed?'<button class="join" style="margin-top:8px" onclick="s.equipped=\'cards\';collection()">Put it on</button>':''}</div><div class="reward"><div class="art">🌱</div><h3>Taking Root</h3><p>3 walks on different days</p></div><div class="reward"><div class="art">🏓</div><h3>Rally Energy</h3><p>3 court days</p></div><div class="reward"><div class="art">✨</div><h3>Plot Twist</h3><p>Try 4 activity families</p></div></div><div class="panel" style="margin-top:14px"><b>Why this exists</b><p class="small" style="margin-top:5px">Rewards are cosmetic memories. They never raise matchmaking priority, certify safety, or gate ordinary groups.</p></div>`}function crew(){main.innerHTML=`<div class="heading"><h1>Good people. Again.</h1><p>Mutual connections from things you actually did.</p></div>${[['MY','Maya','Open to cards for 20 min'],['SM','Sam','2 walks together'],['LO','Leo','3 game nights together']].map(x=>`<div class="panel crew"><span class="face">${x[0]}</span><div><b>${x[1]}</b><p class="small">${x[2]}</p></div><button onclick="toast('Demo only · no real invite sent')">Start something</button></div>`).join('')}<div class="panel"><b>A few good things</b><p class="small" style="margin-top:6px">Finite, opt-in recaps. No follower counts, likes race, live-location feed, or public social score.</p></div>`}function openCreate(){modal.innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeM()"><div class="modal"><button class="close" onclick="closeM()">×</button><h2>Start something good.</h2><p class="small">Four quick choices. Open only the spots you need.</p><div class="field"><label>What?</label><select class="control" id="ca">${groups.map(g=>`<option>${g.title}</option>`).join('')}</select></div><div class="field"><label>Where?</label><select class="control"><option>Common Table Café</option><option>Commons Courts</option><option>Cedar Park</option></select></div><div class="field"><label>Starting in</label><div class="seg"><button class="on">Now</button><button>10m</button><button>20m</button></div></div><div class="field"><label>People total</label><select class="control"><option>4 people</option><option>3 people</option><option>5 people</option></select></div><button class="cta" onclick="closeM();toast('Demo round created locally. Nothing was published.')">Open the spots</button></div></div>`}function guide(){modal.innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeM()"><div class="modal"><button class="close" onclick="closeM()">×</button><h2>What sounds good?</h2><p class="small">This demo guide only filters sample groups. It never joins or messages for you.</p><div class="field"><label>Try a mood</label><div class="seg"><button onclick="closeM();s.q='coffee';now()">Easy</button><button onclick="closeM();s.q='Spades';now()">Play</button><button onclick="closeM();s.q='walk';now()">Outside</button></div></div></div></div>`}function closeM(){modal.innerHTML=''}function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>t.hidden=true,2600)}function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}fab.onclick=openCreate;render();</script></body></html>
