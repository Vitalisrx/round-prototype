name: Archived V4 core checks
on:
  push:
    branches: [main, design/v4-20260917]
    paths: ['v4-*.js', 'test-core.js', '.github/workflows/v4-checks.yml']
  pull_request:
    branches: [main]
    paths: ['v4-*.js', 'test-core.js', '.github/workflows/v4-checks.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preserve archived V4 source syntax
        run: |
          node --check v4-core.js
          node --check v4-art.js
          node --check v4-app.js
      - name: Run archived V4 invariants
        run: node test-core.js
