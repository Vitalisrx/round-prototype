name: V5 release verification
on:
  push:
    branches: [main, design/v5-20260917]
    paths: ['index.html', 'v5/**', 'tests/**', 'build.py', '.github/workflows/v5-checks.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'v5/**', 'tests/**', 'build.py', '.github/workflows/v5-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and core invariants
        run: |
          node --check v5/core.js
          node --check v5/art.js
          node --check v5/app.js
          node tests/core.test.js
          python build.py
      - name: Install tested browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual HTTP origin, not injected HTML
        run: |
          mkdir -p screens
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/round-http.log 2>&1 &
          for n in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          BASE_URL=http://127.0.0.1:8765/ python tests/browser.test.py
      - name: Publish immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-application-${{ github.run_id }}
          path: |
            tests/*results.json
            tests/failure.png
            screens/
            round_v5.html
          retention-days: 14
  public-preview:
    needs: application
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check the actual public preview URL and complete a demo round
        env:
          PREVIEW_REF: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
        run: |
          mkdir -p screens
          python tests/public.test.py
      - name: Save public-host evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-public-${{ github.run_id }}
          path: |
            tests/public-results.json
            screens/public-*.png
          retention-days: 14
